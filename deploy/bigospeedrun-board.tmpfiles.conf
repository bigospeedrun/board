# /etc/tmpfiles.d/bigospeedrun-board.conf (not installed yet). The socket directories that
# Caddy connects to: one per service, so each service mounts only its own. The group is
# wg-caddy by number (64543 on the VPS since 2026-10-09): wg-caddy is a DynamicUser group,
# and its name may not resolve when tmpfiles runs at boot. Mode 2770: Caddy and the
# service (group_add BOARD_SOCKET_GID) reach the socket, other local users do not.
d /run/bigospeedrun-board      0755 root root  -
d /run/bigospeedrun-board/api  2770 root 64543 -
d /run/bigospeedrun-board/auth 2770 root 64543 -
