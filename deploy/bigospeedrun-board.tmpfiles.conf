# /etc/tmpfiles.d/bigospeedrun-board.conf (not installed yet). The socket directories that
# Caddy connects to, one per service, so each service mounts only its own. tmpfiles makes
# them early at boot with group root, so they exist before Docker restarts the containers.
# Their group is wg-caddy's, which is dynamic (DynamicUser) and resolves only while
# wg-caddy runs: socket-dirs.sh (ExecStartPre of bigospeedrun-board.service) sets it by
# name. Until then the services cannot make their sockets and restart by themselves.
d /run/bigospeedrun-board      0755 root root -
d /run/bigospeedrun-board/api  2770 root root -
d /run/bigospeedrun-board/auth 2770 root root -
