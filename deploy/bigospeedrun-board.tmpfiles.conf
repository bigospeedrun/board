# /etc/tmpfiles.d/bigospeedrun-board.conf. The socket directories that Caddy connects to,
# one per service, so each service mounts only its own. tmpfiles makes them early at boot
# with group root, so they exist before Docker restarts the containers. Their group is
# wg-caddy's, which is dynamic (DynamicUser) and resolves only while wg-caddy runs:
# socket-dirs.sh (ExecStartPre of bigospeedrun-board.service) sets it by name. Until then
# the services cannot make their sockets and restart by themselves.
# The ":" before the mode, user and group applies them only when tmpfiles creates the
# directory (tmpfiles.d(5)). Any later `systemd-tmpfiles --create` leaves an existing
# directory alone. Without it, an unattended systemd upgrade on 2026-10-16 06:16 UTC reset
# api and auth to root:root, and Caddy got no access (board 502 for about 18 minutes).
d /run/bigospeedrun-board      0755  root  root  -
d /run/bigospeedrun-board/api  :2770 :root :root -
d /run/bigospeedrun-board/auth :2770 :root :root -
