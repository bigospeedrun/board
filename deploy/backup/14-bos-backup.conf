# /etc/ssh/sshd_config.d/14-bos-backup.conf (not installed yet). Race board backups: the
# bosbackup login can only run the dump program. A copy of Wall Game's 10-wallgame-backup.conf.
# authorized_keys repeats this with from="<backup host>",restrict,command="...".
# The login must also be in AllowUsers (00-wallgame-hardening.conf on the VPS).
Match User bosbackup
	AuthenticationMethods publickey
	ForceCommand /usr/bin/sudo -n /usr/local/sbin/bos-board-backup-dump
	PermitTTY no
	DisableForwarding yes
	AllowTcpForwarding no
	AllowStreamLocalForwarding no
	AllowAgentForwarding no
	X11Forwarding no
	PermitTunnel no
	PermitUserRC no
