# Race board compose fragment (phase E). Nil ruling 2026-10-15: one narrow boxed path.
# Include it in the bigospeedrun compose project on the VPS (not deployed yet).
#
#   board-db       Postgres, no network, unix socket only, own volume
#   board-migrate  one-off: migrations + role passwords (owner role), no network
#   board-api      POST/GET https://board.bigospeedrun.com/board/api/posts, NO network: unix sockets only
#   board-auth     https://board.bigospeedrun.com/board/auth/*, network only to board-egress
#   board-egress   allowlist proxy (vendored from the site, cb1123e): CONNECT github.com:443, api.github.com:443
#   board-admin    one-off maintainer CLI (ban, revoke, hide, stats), no network
#
# Follows the self-host playbook's "Boxed public write surface". Each service has its own
# uid (api 10001, auth 10002, migrate 10003, admin 10004, egress 10005). Host setup:
# /etc/bigospeedrun/board/ holds the secret files, root-owned, mode 0440, each readable
# by one group only: owner_password 999 (postgres), app_password 10001, auth_password,
# github_client_secret and state_secret 10002, owner_password_node and dump_password
# 10003, admin_password 10004. (Root also reads dump_password: the bosbackup dump program.) /run/bigospeedrun-board/api and /run/bigospeedrun-board/auth are
# two directories owned by Caddy's group (wg-caddy, gid in BOARD_SOCKET_GID), mode 2770:
# Caddy reaches both sockets, and each service sees only its own directory.
x-hardening: &hardening
  read_only: true
  tmpfs: ['/tmp:size=16m,mode=1777']
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  restart: unless-stopped
  logging: {driver: local, options: {max-size: 10m, max-file: '3'}}

x-board: &board
  <<: *hardening
  image: ${BOARD_IMAGE:?set BOARD_IMAGE to bigospeedrun-board@sha256:...}
  group_add: ['${BOARD_SOCKET_GID:?set BOARD_SOCKET_GID to the gid of wg-caddy}']
  cpus: 0.25
  mem_limit: 256m
  memswap_limit: 256m             # no swap use
  pids_limit: 64
  environment: &board-env
    NODE_ENV: production
    PGHOST: /var/run/postgresql
    PGDATABASE: board
    BOARD_ORIGIN: https://board.bigospeedrun.com   # the board's own host (deploy/board.caddy)
    BOARD_WRITES: ${BOARD_WRITES:-on}   # the kill switch: off makes every write 503
  depends_on:
    board-db: {condition: service_healthy}
    board-migrate: {condition: service_completed_successfully}

services:
  board-db:
    <<: *hardening
    image: postgres:18.6-bookworm@sha256:7d3852670a11f0cb9cb1cd50916dc02a0021143fb22d96b78eeef26348abe55c
    user: '999:999'
    network_mode: none
    cpus: 0.5
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 100
    tmpfs: ['/tmp:size=64m,mode=1777']
    environment:
      POSTGRES_USER: board_owner
      POSTGRES_DB: board
      POSTGRES_PASSWORD_FILE: /run/secrets/owner_password
      # The image trusts every local socket login by default; the board services share
      # the socket, so require passwords everywhere (checked by the container tests).
      POSTGRES_INITDB_ARGS: --auth-local=scram-sha-256 --auth-host=scram-sha-256
    command: [postgres, -c, "listen_addresses=", -c, max_connections=20, -c, shared_buffers=64MB,
              -c, "log_line_prefix=%m %u ", -c, log_min_duration_statement=1000]
    volumes:
      - board-db-data:/var/lib/postgresql
      - board-db-socket:/var/run/postgresql
      - ${BOARD_SECRETS_DIR:-/etc/bigospeedrun/board}/owner_password:/run/secrets/owner_password:ro
    healthcheck:
      test: [CMD, pg_isready, -h, /var/run/postgresql, -U, board_owner, -d, board]
      interval: 10s
      timeout: 3s
      retries: 10

  board-migrate:
    <<: *hardening
    image: ${BOARD_IMAGE}
    user: '10003:10003'
    network_mode: none
    restart: 'no'
    cpus: 0.25
    mem_limit: 128m
    memswap_limit: 128m
    pids_limit: 32
    command: [node, --experimental-strip-types, db/migrate.ts]
    environment:
      PGHOST: /var/run/postgresql
      PGDATABASE: board
      PGUSER: board_owner
      PGPASSWORD_FILE: /run/secrets/owner_password
      BOARD_APP_PASSWORD_FILE: /run/secrets/app_password
      BOARD_AUTH_PASSWORD_FILE: /run/secrets/auth_password
      BOARD_ADMIN_PASSWORD_FILE: /run/secrets/admin_password
      BOARD_DUMP_PASSWORD_FILE: /run/secrets/dump_password
    volumes:
      - board-db-socket:/var/run/postgresql
      - ${BOARD_SECRETS_DIR:-/etc/bigospeedrun/board}/owner_password_node:/run/secrets/owner_password:ro
      - ${BOARD_SECRETS_DIR:-/etc/bigospeedrun/board}/app_password:/run/secrets/app_password:ro
      - ${BOARD_SECRETS_DIR:-/etc/bigospeedrun/board}/auth_password:/run/secrets/auth_password:ro
      - ${BOARD_SECRETS_DIR:-/etc/bigospeedrun/board}/admin_password:/run/secrets/admin_password:ro
      - ${BOARD_SECRETS_DIR:-/etc/bigospeedrun/board}/dump_password:/run/secrets/dump_password:ro
    depends_on:
      board-db: {condition: service_healthy}

  board-api:
    <<: *board
    user: '10001:10001'
    network_mode: none            # no route anywhere: Caddy and Postgres via unix sockets
    command: [node, --experimental-strip-types, src/board-api.ts]
    environment:
      <<: *board-env
      PGUSER: board_app
      PGPASSWORD_FILE: /run/secrets/app_password
      BOARD_SOCKET: /run/board-api/api.sock
    healthcheck:
      test: [CMD, node, -e, "require('http').get({socketPath:'/run/board-api/api.sock',path:'/board/api/posts?board=3sum&limit=1'},r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      retries: 5
    volumes:
      - board-db-socket:/var/run/postgresql
      - ${BOARD_API_SOCKET_DIR:-/run/bigospeedrun-board/api}:/run/board-api
      - ${BOARD_SECRETS_DIR:-/etc/bigospeedrun/board}/app_password:/run/secrets/app_password:ro

  board-auth:
    <<: *board
    user: '10002:10002'
    networks: [board-egress-internal]   # internal network: its only peer is board-egress
    command: [node, --experimental-strip-types, src/board-auth.ts]
    environment:
      <<: *board-env
      PGUSER: board_auth
      PGPASSWORD_FILE: /run/secrets/auth_password
      BOARD_SOCKET: /run/board-auth/auth.sock
      # Public id of the GitHub OAuth app (callback https://board.bigospeedrun.com/board/auth/callback).
      GITHUB_CLIENT_ID: Ov23ctm5ehCmmmzfQpL6
      GITHUB_CLIENT_SECRET_FILE: /run/secrets/github_client_secret
      BOARD_STATE_SECRET_FILE: /run/secrets/state_secret
      NODE_USE_ENV_PROXY: '1'
      HTTPS_PROXY: http://board-egress:3128
      HTTP_PROXY: http://board-egress:3128
      NO_PROXY: ''
    healthcheck:
      test: [CMD, node, -e, "require('http').get({socketPath:'/run/board-auth/auth.sock',path:'/board/auth/account'},r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      retries: 5
    volumes:
      - board-db-socket:/var/run/postgresql
      - ${BOARD_AUTH_SOCKET_DIR:-/run/bigospeedrun-board/auth}:/run/board-auth
      - ${BOARD_SECRETS_DIR:-/etc/bigospeedrun/board}/auth_password:/run/secrets/auth_password:ro
      - ${BOARD_SECRETS_DIR:-/etc/bigospeedrun/board}/github_client_secret:/run/secrets/github_client_secret:ro
      - ${BOARD_SECRETS_DIR:-/etc/bigospeedrun/board}/state_secret:/run/secrets/state_secret:ro
    depends_on:
      board-db: {condition: service_healthy}
      board-migrate: {condition: service_completed_successfully}
      board-egress: {condition: service_started}

  board-egress:
    <<: *hardening
    image: ${BOARD_IMAGE}
    user: '10005:10005'
    cpus: 0.1
    mem_limit: 96m
    memswap_limit: 96m
    pids_limit: 32
    networks: [board-egress-internal, board-egress-out]
    command: [node, src/vendor/egress-proxy.mjs]
    environment:
      EGRESS_ALLOW: github.com:443,api.github.com:443   # exact host:port pairs, nothing else
      EGRESS_PORT: '3128'

  board-admin:
    <<: *hardening
    image: ${BOARD_IMAGE}
    user: '10004:10004'
    network_mode: none
    restart: 'no'
    cpus: 0.25
    mem_limit: 128m
    memswap_limit: 128m
    pids_limit: 32
    profiles: [admin]             # never started by `up`; run with `compose run --rm board-admin ...`
    entrypoint: [node, --experimental-strip-types, src/admin.ts]
    environment:
      PGHOST: /var/run/postgresql
      PGDATABASE: board
      PGUSER: board_admin
      PGPASSWORD_FILE: /run/secrets/admin_password
    volumes:
      - board-db-socket:/var/run/postgresql
      - ${BOARD_SECRETS_DIR:-/etc/bigospeedrun/board}/admin_password:/run/secrets/admin_password:ro

networks:
  board-egress-internal: {internal: true}   # no gateway: board-auth cannot reach the internet
  board-egress-out: {}                      # board-egress only

volumes:
  board-db-data: {}
  board-db-socket: {}
