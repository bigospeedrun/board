# Build the board image and push it to GHCR (ghcr.io/bigospeedrun/board, a public
# package) on every push to main, after the typecheck and the unit tests. Tags:
# sha-<commit> and main. The VPS runs one image by digest (BOARD_IMAGE in
# deploy/compose.board.yml), never a moving tag. test.yml runs the DB tests on the same
# push. Retention is the same as the site's site-image.yml: the newest 30 images.
name: Build board image
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: board-image
  cancel-in-progress: false
env:
  IMAGE_OWNER: bigospeedrun
  IMAGE_NAME: board
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          check-latest: true
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck and unit tests
        run: |
          npm run typecheck
          npm test
      - name: Build and push the image
        env:
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
          COMMIT: ${{ github.sha }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          image="ghcr.io/$IMAGE_OWNER/$IMAGE_NAME"
          # One plain linux/amd64 manifest (the VPS), no attestation index.
          docker buildx build --platform linux/amd64 --provenance=false --sbom=false \
            --label "org.opencontainers.image.revision=$COMMIT" \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            -t "$image:sha-$COMMIT" -t "$image:main" --push .
          docker logout ghcr.io
          digest=$(node scripts/image-registry.mjs digest "sha-$COMMIT")
          echo "BOARD_IMAGE=$image@$digest" >> "$GITHUB_STEP_SUMMARY"
      - name: Check that the package is public
        # GITHUB_TOKEN cannot change a package's visibility. The first push creates the
        # package; a maintainer makes it public once in the org's package settings.
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://ghcr.io/token?scope=repository:$IMAGE_OWNER/$IMAGE_NAME:pull")
          if [ "$code" != 200 ]; then echo "::warning::ghcr.io/$IMAGE_OWNER/$IMAGE_NAME is not public (anonymous pull token: HTTP $code)"; fi
      - name: Keep the newest 30 images
        continue-on-error: true
        env:
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
        # The VPS keeps the running and the previous image locally, so a pruned tag never
        # breaks what runs or its rollback. Tags main and keep-* are never pruned.
        run: node scripts/image-registry.mjs prune 30
