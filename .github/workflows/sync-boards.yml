# Give every race that bigospeedrun.com lists its board, with no person in the loop (Nil
# rule 2026-10-16: one race, one board, one Discord channel; no recurring manual step).
# Every hour, scripts/sync-boards.ts reads the site's public race list and writes a
# migration when a race has no board, or when the order or a title changed, together with
# the test race list (test/fixtures/chat-knowledge.races.json). The job runs the type check
# and the unit tests, commits both to main, then starts image.yml and test.yml (the DB
# tests): a push with GITHUB_TOKEN does not start other workflows; a workflow_dispatch does. The VPS auto-deploy then deploys
# the image after its off-box backup gate. Boards are never removed or renamed by slug.
# The office box also starts this workflow when its race-parity reader sees a race with no
# board, so a late GitHub schedule does not delay a new board.
name: Sync boards with the site
on:
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: board-sync
  cancel-in-progress: false
jobs:
  sync:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          check-latest: true
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Write a migration for new races, order or titles
        run: node --experimental-strip-types scripts/sync-boards.ts --write
      - name: Test, commit and build when a migration was written
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add -- db/migrations test/fixtures/chat-knowledge.races.json
          if git diff --cached --quiet; then
            echo 'Every listed race has its board, in the site order, with the site titles.'
            exit 0
          fi
          git diff --cached --name-only
          npm run typecheck
          npm test
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Sync boards with the races listed on bigospeedrun.com'
          gh auth setup-git
          # A rejected push (main moved) fails this run; the next run starts from the new main.
          git push --quiet origin "HEAD:refs/heads/$TARGET_BRANCH"
          gh workflow run image.yml --ref "$TARGET_BRANCH"
          gh workflow run test.yml --ref "$TARGET_BRANCH"
